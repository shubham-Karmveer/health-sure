server:
  port: ${PORT:8080}

spring:
  application:
    name: healthdekho-api
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          options:
            model: ${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthdekho}
    username: ${DATABASE_USERNAME:capstoneproject}
    password: ${DATABASE_PASSWORD:capstoneproject_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:healthdekho-local-only-signing-key-change-before-production}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  seed:
    customer:
      enabled: ${SEED_CUSTOMER_ENABLED:false}
      email: ${SEED_CUSTOMER_EMAIL:}
      password: ${SEED_CUSTOMER_PASSWORD:}
    catalog:
      enabled: ${SEED_CATALOG_ENABLED:true}
  ai:
    provider: ${AI_PROVIDER:stub}
    model-name: ${AI_MODEL_NAME:healthdekho-local-stub}
    model-version: ${AI_MODEL_VERSION:v1}
    prompt-version: ${AI_PROMPT_VERSION:recommendations-v1}
    bedrock:
      model-name: ${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
      max-tokens: ${BEDROCK_MAX_TOKENS:1024}
      temperature: ${BEDROCK_TEMPERATURE:0.1}
