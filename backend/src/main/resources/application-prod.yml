server:
  port: ${PORT:5000}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
    clean-disabled: true

app:
  auth:
    demo:
      email: ${DEMO_LOGIN_EMAIL}
      password: ${DEMO_LOGIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    cookie-secure: true
  cors:
    allowed-origin: ${FRONTEND_ORIGIN}
  seed:
    customer:
      enabled: false
    catalog:
      enabled: false
  ai:
    provider: ${AI_PROVIDER:bedrock}
    model-name: ${AI_MODEL_NAME:bedrock}
    model-version: ${AI_MODEL_VERSION:configured}
    prompt-version: ${AI_PROMPT_VERSION:recommendations-v1}
    bedrock:
      model-name: ${BEDROCK_MODEL_ID:us.anthropic.claude-haiku-4-5-20251001-v1:0}
      max-tokens: ${BEDROCK_MAX_TOKENS:1024}
      temperature: ${BEDROCK_TEMPERATURE:0.1}
