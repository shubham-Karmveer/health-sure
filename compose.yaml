services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthdekho
      POSTGRES_USER: healthdekho_dev
      POSTGRES_PASSWORD: healthdekho_dev_password
    ports:
      - "5432:5432"
    volumes:
      - healthdekho-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthdekho_dev -d healthdekho"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthdekho-postgres:
