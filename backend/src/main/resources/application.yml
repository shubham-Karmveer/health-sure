server:
  port: ${PORT:8080}

spring:
  application:
    name: healthdekho-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthdekho}
    username: ${DATABASE_USERNAME:healthdekho_dev}
    password: ${DATABASE_PASSWORD:healthdekho_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:healthdekho-local-only-signing-key-change-before-production}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  seed:
    customer:
      enabled: ${SEED_CUSTOMER_ENABLED:false}
      email: ${SEED_CUSTOMER_EMAIL:}
      password: ${SEED_CUSTOMER_PASSWORD:}
